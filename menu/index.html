<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Menu of the Day</title>
	<link rel="stylesheet" href="style_media.css">
	<link rel="icon" href="fav.ico" type="image/x-icon">
</head>
<body>
	<div class="modal" id="modal">
			<p>Please,<br> choose a day of the week</p>
			<div class="btns">
				<select name="selectDay" id="selectDay">
					<option id="defaultOption" value="" disabled selected>choose a day...</option>
				<option value="1">Mon</option>
				<option value="2">Tue</option>
				<option value="3">Wed</option>
				<option value="4">Thu</option>
				<option value="5">Fri</option>
				<option value="6">Sat</option>
				<option value="0">Sun</option>
			</select>
			<span style="opacity: 0.3;margin:2px 0;font-size: 10px;">or</span>
			<div class="btn" id="setToday">Pick today</div>
			</div>
		</div>
		<div class="modal2" id="modal2">
			<p>Your order</p>
			<div class="hor_line"> </div>
			<div class="forpre" id="forpre">
				<br>
			  welcome,<br><br>
			  your receipt will be here! <br>
			  -------------------------
			</div>
			<div class="btns2">
				<div class="btn" id="back">Back</div>
				<div class="btn" id="clearBack">Clear and back</div>
				<div class="btn" id="send">Send</div>
			</div>
		</div>
	<div class="wrap" id="wrap">
		<aside id="menu">
			<div class="menu_header">
				<h2>MENU</h2>
				<p id="today"> - of monday - </p>
			</div>
			<div class="line"></div>
			<div class="menu_wrap">
				<ul id="ulmenu_fst" class="fst">
				</ul>
				<ul id="ulmenu_scn"  class="scn">
				</ul>
				<ul id="ulmenu_drn" class="drn">
				</ul>
			</div>
		</aside>
		<section id="main">
			<div class="main_header">
				<div class="for_order"><span id="order_of">order</span><span id="cusname"></span></div>
			</div>
			<div class="line sec"></div>
			<div class="main_wrap">
				<div class="customer">
					<p>choose a customer</p>
					<select name="name" id="customer">
						<option value=""  selected="selected" disabled>choose...</option>
						<option value="Sergey Brin">Sergey Brin</option>
						<option value="Elon Musk">Elon Musk</option>
						<option value="Chu Chang">Chu Chang</option>
					</select>
				</div>
				<div class="table">
					<div class="table_top">
						<div class="cell">item</div>
						<div class="cell">qty</div>
						<div class="cell price">price</div>
						<div class="cell totalH">total</div>

					</div>
					<div class="table_body" id="table_body"></div>
				</div>
				<div class="buttons">
					<div class="btn" id="changeDay">change day</div>
					<div class="btn" id="clear">clear</div>
					<div class="btn" id="final">checkout</div>
				</div>
			</div>
		</section>
	</div>
	<div class="author"> <a href="https://github.com/kirilinsky" target="_blank">dev by kirilinsky @ 2018</a></div>
	<script src="cont.js"></script>
</body>
</html>
